name: Publish @atanael/ui

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Ensure latest npm (OIDC support)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build library
        run: npm run build:ui

      - name: Verify package contents
        run: npm run pack:verify

      # Trusted Publishing: no NODE_AUTH_TOKEN is needed when the workflow is
      # registered as a Trusted Publisher on npm. --provenance signs the build.
      - name: Publish
        run: npm publish --workspace @atanael/ui --provenance --access public
